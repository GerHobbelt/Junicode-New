    code: |
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2"> <push>sh-a pt-a pt-a ref2 ref1</push> <command name="SRP1"/> <command name="SRP2"/> <command name="IP"/> <command name="MDAP" modifier="1"/> <command name="SHP" modifier="1"/> <compile-if test="cv &gt;= 0"> <push>sh-b pt-b cv</push> <command name="MIRP" modifier="11101"/> <command name="SHP" modifier="0"/> <else> <push>sh-b pt-b</push> <command name="MDRP" modifier="11101"/> <command name="SHP" modifier="0"/> </else> </compile-if>
