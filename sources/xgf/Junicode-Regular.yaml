          </reference>
          <set ref="pt-a-sh"/>
        </shift>
      </code>
  hook:
    pt-a:
      type: point
      subtype: target
    pt-b:
      type: point
      subtype: target
    pt-c:
      type: point
      subtype: target
    cv:
      val: -1
      type: pos
    code: |
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
        <compile-if test="cv &gt;= 0">
          <push>pt-c pt-b pt-a cv</push>
          <command name="MIAP" modifier="1"/>
          <command name="MDRP">
            <modifier type="color" value="black"/>
          </command>
          <command name="MDRP">
            <modifier type="color" value="black"/>
          </command>
          <else>
            <push>pt-c pt-b pt-a</push>
            <command name="MDAP" modifier="1"/>
            <command name="MDRP">
              <modifier type="color" value="black"/>
            </command>
            <command name="MDRP">
              <modifier type="color" value="black"/>
            </command>
          </else>
        </compile-if>
      </code>
  cap-round-stem:
    pt-a:
      type: point
      subtype: target
    pt-b:
      type: point
      subtype: target
    cv:
      val: cap-baseline-undershoot
