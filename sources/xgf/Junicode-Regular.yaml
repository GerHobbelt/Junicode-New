    code: |
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
        <move distance="cv">
          <point num="pt-a"/>
          <move round="no">
            <point num="pt-b"/>
          </move>
        </move>
      </code>
  lc-round-stem:
    pt-a:
