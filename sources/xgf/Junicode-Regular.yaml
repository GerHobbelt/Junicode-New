prep:
  code: |-
    <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
                <!-- Turn off hinting above 300 ppem -->
                <if test="pixels-per-em &gt; 300">
                    <disable-instructions/>
                </if>
                <!-- Dropout control -->
                <push>4 511</push>
                <command name="SCANCTRL"/>
                <command name="SCANTYPE"/>
                </code>
functions:
  delta:
    primitive: true
    stack-safe: true
    size:
      type: int
      val: 25
    distance:
      type: int
      val: 0
    pt:
      type: point
      subtype: target
    code: |-
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
              <command name="SDB"/>
              <command name="DUP"/>
              <push>0</push>
              <command name="NEQ"/>
              <command name="IF"/>
              <command name="DUP"/>
              <push>0</push>
              <command name="LT"/>
              <command name="IF"/>
              <push>8</push>
              <command name="ADD"/>
              <command name="ELSE"/>
              <push>7</push>
              <command name="ADD"/>
              <command name="EIF"/>
              <command name="SWAP"/>
              <push>1</push>
              <command name="DELTAP1"/>
              <command name="ELSE"/>
              <command name="POP"/>
              <command name="POP"/>
              <command name="EIF"/>
              <push>8</push>
              <command name="SDB"/>
              </code>
  serif-helper:
    stack-safe: true
    base:
      type: point
      subtype: target
    pt-a:
      type: point
      subtype: target
    base-cv:
      val: baseline
      type: pos
    cup-cv:
      val: cap-baseline-undershoot
      type: dist
    ppem:
      type: int
      val: 190
    code: |
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
        <move distance="base-cv">
          <point num="base"/>
        </move>
        <if test="pixels-per-em &lt; ppem">
          <align>
            <point num="pt-a"/>
          </align>
          <else>
            <command name="RTDG"/>
            <move distance="cup-cv">
              <reference>
                <point num="base"/>
              </reference>
              <point num="pt-a"/>
            </move>
            <command name="RTG"/>
          </else>
        </if>
      </code>
  align-or-shift:
    stack-safe: true
    primitive: true
    ppem:
      type: int
      val: 43
    r:
      type: point
      subtype: ref
    p:
      type: point
      subtype: target
    code: |
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
        <command name="MPPEM"/>
        <command name="GT"/>
        <command name="IF"/>
        <command name="SRP0"/>
        <command name="ALIGNRP"/>
        <command name="ELSE"/>
        <command name="SRP1"/>
        <command name="SHP" modifier="1"/>
        <command name="EIF"/>
      </code>
  mid-stem-f:
    stack-safe: true
    primitive: true
    top:
      type: point
      subtype: ref
    bar-top:
      type: point
      subtype: target
    bar-bot:
      type: point
      subtype: target
    base:
      type: point
      subtype: ref
    code: |-
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
        <command name="DUP"/>
        <push>3</push>
        <command name="CINDEX"/>
        <command name="MD" modifier="1"/>
        <push>4</push>
        <command name="CINDEX"/>
        <push>6</push>
        <command name="CINDEX"/>
        <command name="MD" modifier="1"/>
        <command name="DUP"/>
        <command name="ROLL"/>
        <command name="ADD"/>
        <command name="ROLL"/>
        <push>6</push>
        <command name="CINDEX"/>
        <command name="MD" modifier="0"/>
        <push>5</push>
        <command name="CINDEX"/>
        <command name="DUP"/>
        <command name="SRP0"/>
        <push>5</push>
        <command name="CINDEX"/>
        <command name="DUP"/>
        <command name="MDRP" modifier="11001"/>
        <command name="MD" modifier="0"/>
        <command name="ADD"/>
        <command name="ROLL"/>
        <command name="MUL"/>
        <command name="SWAP"/>
        <command name="DIV"/>
        <command name="ROUND" modifier="01"/>
        <push>3</push>
        <command name="CINDEX"/>
        <push>5</push>
        <command name="MINDEX"/>
        <command name="MD" modifier="0"/>
        <command name="SUB"/>
        <command name="DUP"/>
        <command name="ROLL"/>
        <command name="SWAP"/>
        <command name="SHPIX"/>
        <command name="SHPIX"/>
      </code>
macros:
  cap-serif:
    base:
      type: point
      subtype: target
    base-sh:
      type: point
      subtype: target
      val: -1
    pt-a:
      type: point
      subtype: target
    pt-a-sh:
      type: point
      subtype: target
      val: -1
    pt-b:
      type: point
      subtype: target
    pt-b-sh:
      type: point
      subtype: target
      val: -1
    base-cv:
      val: baseline
      type: pos
    cup-cv:
      val: cap-serif-undershoot
      type: pos
    ppem:
      type: int
      val: 160
    code: |
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
        <move distance="base-cv">
          <point num="base"/>
          <shift compile-if="not( nan(base-sh) ) and base-sh &gt;= 0">
            <point num="base-sh"/>
          </shift>
          <shift compile-if="nan(base-sh)">
            <set ref="base-sh"/>
          </shift>
          <move round="no">
            <point num="pt-b"/>
            <shift compile-if="not( nan(pt-b-sh) ) and pt-b-sh &gt;= 0">
              <point num="pt-b-sh"/>
            </shift>
            <shift compile-if="nan(pt-b-sh)">
              <set ref="pt-b-sh"/>
            </shift>
          </move>
        </move>
        <call-function name="serif-helper">
          <with-param name="base" value="base"/>
          <with-param name="pt-a" value="pt-a"/>
          <with-param name="base-cv" value="base-cv"/>
          <with-param name="cup-cv" value="cup-cv"/>
          <with-param name="ppem" value="ppem"/>
        </call-function>
        <shift compile-if="not( nan(pt-a-sh) ) and pt-a-sh &gt;= 0">
          <reference>
            <point num="pt-a"/>
          </reference>
          <point num="pt-a-sh"/>
        </shift>
        <shift compile-if="nan(pt-a-sh)">
          <reference>
            <point num="pt-a"/>
          </reference>
          <set ref="pt-a-sh"/>
        </shift>
      </code>
  unbalanced-T:
    base:
      type: point
      subtype: target
    pt-left-top:
      type: point
      subtype: target
    pt-left-bottom:
      type: point
      subtype: target
    pt-right-top:
      type: point
      subtype: target
    pt-right-bottom:
      type: point
      subtype: target
    base-cv:
      val: -1
      type: pos
    left-cv:
      val: -1
      type: dist
    right-cv:
      val: -1
      type: dist
    ppem:
      type: int
      val: 250
    code: |
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
        <compile-if test="base-cv &lt; 0">
          <push>base</push>
          <command name="MDAP" modifier="1"/>
          <else>
            <push>base base-cv</push>
            <command name="MIAP" modifier="1"/>
          </else>
        </compile-if>
        <compile-if test="left-cv &lt; 0">
          <push>pt-left-bottom</push>
          <command name="MDRP" modifier="01101"/>
          <else>
            <push>pt-left-bottom left-cv</push>
            <command name="MIRP" modifier="01101"/>
          </else>
        </compile-if>
        <compile-if test="right-cv &lt; 0">
          <push>pt-right-bottom</push>
          <command name="MDAP" modifier="11101"/>
          <else>
            <push>pt-right-bottom right-cv</push>
            <command name="MIRP" modifier="11101"/>
          </else>
        </compile-if>
        <call-function name="serif-helper">
          <with-param name="base" value="base"/>
          <with-param name="pt-a" value="pt-left-top"/>
          <with-param name="base-cv" value="base-cv"/>
          <with-param name="ppem" value="ppem"/>
        </call-function>
        <call-function name="serif-helper">
          <with-param name="base" value="base"/>
          <with-param name="pt-a" value="pt-right-top"/>
          <with-param name="base-cv" value="base-cv"/>
          <with-param name="ppem" value="ppem"/>
        </call-function>
      </code>
  lc-serif:
    base:
      type: point
      subtype: target
    base-sh:
      type: point
      subtype: target
      val: -1
    pt-a:
      type: point
      subtype: target
    pt-a-sh:
      type: point
      subtype: target
      val: -1
    pt-b:
      type: point
      subtype: target
    pt-b-sh:
      type: point
      subtype: target
      val: -1
    base-cv:
      val: baseline
      type: pos
    cup-cv:
      val: lc-serif-undershoot
      type: pos
    ppem:
      type: int
      val: 180
    code: |
      <code xmlns="http://xgridfit.sourceforge.net/Xgridfit2">
        <compile-if test="base-cv &gt;= 0">
          <move distance="base-cv">
            <point num="base"/>
            <shift compile-if="not( nan(base-sh) ) and base-sh &gt;= 0">
              <point num="base-sh"/>
            </shift>
            <shift compile-if="nan(base-sh)">
              <set ref="base-sh"/>
            </shift>
            <move round="no">
              <point num="pt-b"/>
              <shift compile-if="not( nan(pt-b-sh) ) and pt-b-sh &gt;= 0">
                <point num="pt-b-sh"/>
              </shift>
              <shift compile-if="nan(pt-b-sh)">
                <set ref="pt-b-sh"/>
              </shift>
            </move>
          </move>
          <else>
            <move>
              <point num="base"/>
              <shift compile-if="not( nan(base-sh) ) and base-sh &gt;= 0">
                <point num="base-sh"/>
              </shift>
              <shift compile-if="nan(base-sh)">
                <set ref="base-sh"/>
              </shift>
              <move round="no">
                <point num="pt-b"/>
                <shift compile-if="not( nan(pt-b-sh) ) and pt-b-sh &gt;= 0">
                  <point num="pt-b-sh"/>
                </shift>
                <shift compile-if="nan(pt-b-sh)">
                  <set ref="pt-b-sh"/>
                </shift>
              </move>
            </move>
          </else>
        </compile-if>
        <call-function name="serif-helper">
          <with-param name="base" value="base"/>
          <with-param name="pt-a" value="pt-a"/>
          <with-param name="base-cv" value="base-cv"/>
          <with-param name="cup-cv" value="cup-cv"/>
          <with-param name="ppem" value="ppem"/>
        </call-function>
        <shift compile-if="not( nan(pt-a-sh) ) and pt-a-sh &gt;= 0">
          <reference>
            <point num="pt-a"/>
          </reference>
          <point num="pt-a-sh"/>
        </shift>
          <shift compile-if="nan(pt-a-sh)">
          <reference>
            <point num="pt-a"/>
          </reference>
        <set ref="pt-a-sh"/> </shift>
      </code>
  sc-serif:
    base:
      type: point
      subtype: target
    base-sh:
      type: point
      subtype: target
      val: -1
    pt-a:
      type: point
      subtype: target
    pt-a-sh:
      type: point
      subtype: target
      val: -1
    pt-b:
